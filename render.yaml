# Render Blueprint. Import this rather than clicking through the dashboard, so
# the deployment is reviewable in the repo instead of living in a browser tab.
#
# Its own service, separate from lostphone, deliberately: different API keys,
# independent deploys, and two URLs to open in front of judges on the same day.
# A broken build on one must not take the other down.
#
# Free instances sleep when idle and take about a minute to wake. Open the URL a
# few minutes before demoing.
services:
  - type: web
    name: downstream
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # live calls the real providers. It is safe to run in front of judges
      # because failure is not fatal: a call that errors or times out falls
      # back to the committed recording and the page says `degraded` with the
      # port that fell back, rather than hiding it. The cost is latency on a
      # cold instance, which is why the URL is worth opening a few minutes
      # early.
      #
      # Set this to `replay` for a demo that must not depend on anybody else's
      # uptime — every response then comes from a committed fixture, and the
      # numbers are identical because the ports parse recordings exactly as
      # they parse live responses.
      - key: DOWNSTREAM_PORTS
        value: live

      # How long one provider gets before we replay a recording instead. The
      # whole request has to finish inside the hosting gateway's patience --
      # past that it answers with its own error page, which a JSON client
      # cannot read and which looks like a bug in this code.
      - key: DOWNSTREAM_TIMEOUT
        value: "8"

      # The deadline watch, in-process. Real while the service is awake, and a
      # free instance sleeps when idle — so on this plan it is a demonstration
      # of the mechanism rather than a promise to a traveller. Production swaps
      # the loop for a cron hitting the same pure schedule. Set to 0 to disable.
      - key: DOWNSTREAM_WATCH
        value: "1"

      # Where alerts go. Any endpoint that accepts a JSON POST — a Slack or
      # Discord incoming webhook is what this was built against. Unset means
      # the log only, and the page says so instead of implying delivery.
      - key: DOWNSTREAM_WEBHOOK
        sync: false

      # The engine is arithmetic and runs without a model; the model reads fare
      # prose into deadlines, fills the blanks a pattern cannot reach in a
      # typed request, and writes the plan's rationale. All three have
      # deterministic fallbacks, so "none" stays a supported mode rather than a
      # broken one -- but bedrock is the sponsor stack and where this is judged.
      #
      # Needs AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY below and model access
      # granted for BEDROCK_MODEL in AWS_DEFAULT_REGION. /health reports
      # `model_status.ready`, so a key that does not work says so on the page
      # instead of silently falling back to templates.
      - key: LLM_PROVIDER
        value: bedrock

      # Same reasoning as DOWNSTREAM_TIMEOUT: the model sits inside a request
      # somebody is watching, and it has a deterministic fallback.
      - key: BEDROCK_TIMEOUT
        value: "12"
      - key: AWS_DEFAULT_REGION
        value: ap-southeast-1
      # AWS_PROFILE must NOT be set here — ~/.aws/credentials does not exist in
      # a container. boto3 picks up the two keys below.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # Only read when DOWNSTREAM_PORTS=live. In replay the committed fixtures
      # cover everything, which is why the demo URL needs none of these.
      #
      # AeroDataBox is reached THROUGH RapidAPI, so the variable is the RapidAPI
      # key, not an AeroDataBox one. An earlier version of this file named it
      # AERODATABOX_KEY, which would have been set correctly and read by
      # nothing.
      - key: RAPIDAPI_KEY
        sync: false
      - key: DUFFEL_TOKEN
        sync: false
      - key: LITEAPI_KEY
        sync: false

      # Unset by default, and unset means /api/admin/wipe answers 404 like a
      # route that does not exist. Set it (any long random string) to clear
      # test data with one curl between rounds; see maintain.py for the
      # run-it-yourself equivalent.
      - key: DOWNSTREAM_ADMIN_TOKEN
        sync: false

      # Trips survive a restart only with a database. Render fills this in from
      # the instance declared below; without it the app keeps trips in memory
      # and /health says so rather than pretending.
      - key: DATABASE_URL
        fromDatabase:
          name: downstream-db
          property: connectionString

databases:
  - name: downstream-db
    plan: free
    databaseName: downstream
    user: downstream
